[audio]
enable_sounds = true

[bar]
order = [ "default"]

[brightness]
enable_ddcutil = true

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[shell]
settings_show_advanced = true

    [shell.screen_corners]
    enabled = true

[theme]
community_palette = "Occult Umbral"
mode = "light"
source = "community"

    [theme.templates]
    builtin_ids = [ "niri" ]

[wallpaper]
directory = "/home/rintaro/Pictures/Wallpapers"

[widget.date]
format = "{:%a, %d %b}"

[widget.tray]
drawer = true
