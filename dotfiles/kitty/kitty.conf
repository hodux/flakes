# cursor
cursor_shape beam
cursor_trail 1

# window
linux_display_server wayland
hide_window_decorations yes
window_margin_width 8
# resize_in_steps no
confirm_os_window_close 0

# use fish shell
shell fish

# copy when text is selected
map ctrl+c    copy_or_interrupt

# font size keybinds
map ctrl+plus          change_font_size all +1
map ctrl+equal         change_font_size all +1
map ctrl+kp_add        change_font_size all +1
map ctrl+minus         change_font_size all -1
map ctrl+underscore    change_font_size all -1
map ctrl+kp_subtract   change_font_size all -1
map ctrl+0             change_font_size all 0
map ctrl+kp_0          change_font_size all 0

# tab management (vim mappings)
map ctrl+shift+t       new_tab
map ctrl+shift+q       close_tab
map ctrl+shift+l       next_tab
map ctrl+shift+h       previous_tab
map ctrl+shift+k       move_tab_forward
map ctrl+shift+j       move_tab_backward
map ctrl+shift+alt+l   move_tab_forward
map ctrl+shift+alt+h   move_tab_backward
map ctrl+shift+alt+t   set_tab_title

# goto tabs
map ctrl+shift+1       goto_tab 1
map ctrl+shift+2       goto_tab 2
map ctrl+shift+3       goto_tab 3
map ctrl+shift+4       goto_tab 4
map ctrl+shift+5       goto_tab 5
map ctrl+shift+6       goto_tab 6
map ctrl+shift+7       goto_tab 7
map ctrl+shift+8       goto_tab 8
map ctrl+shift+9       goto_tab 9

map ctrl+shift+space   next_layout
map ctrl+shift+s       show_scrollback

enable_audio_bell no
font_size 11.0
# BEGIN_KITTY_FONTS
font_family      family="MesloLGL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Copland OS
include current-theme.conf
# END_KITTY_THEME